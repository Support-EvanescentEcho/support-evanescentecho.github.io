<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo carbón con tono cálido profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221F1D" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>

    <!-- Gradiente del cuerpo del cassette (relieve analógico) -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2A26" />
      <stop offset="50%" stop-color="#23201D" />
      <stop offset="100%" stop-color="#1B1917" />
    </linearGradient>

    <!-- Bisel interior de la carcasa -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4540" />
      <stop offset="100%" stop-color="#282522" />
    </linearGradient>

    <!-- Gradiente de la cinta / resonancia de la voz (Echoes) -->
    <linearGradient id="voiceRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#E8B87E" />
      <stop offset="50%" stop-color="#FFE0B2" />
      <stop offset="65%" stop-color="#E8B87E" />
      <stop offset="100%" stop-color="#D4A373" stop-opacity="0.8" />
    </linearGradient>

    <!-- Sombra suave para elevación del chasis -->
    <filter id="cassetteShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- 1. Fondo base (Squircle moderno para Android / Desktop / Store) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- 2. Pulsos de eco sutiles en el fondo (el concepto 'Echoes of Them') -->
  <g opacity="0.18">
    <ellipse cx="256" cy="256" rx="210" ry="170" fill="none" stroke="#D4A373" stroke-width="1.5" stroke-dasharray="6 8" />
    <ellipse cx="256" cy="256" rx="175" ry="140" fill="none" stroke="#D4A373" stroke-width="1.2" stroke-dasharray="4 6" />
  </g>

  <!-- 3. Grupo principal del Cassette (Inscrito 100% en la Safe-Zone: r <= 165px) -->
  <g filter="url(#cassetteShadow)">
    <!-- Chasis exterior: 296x196, rx=22 (Snappeado y seguro frente a máscaras circulares) -->
    <rect x="108" y="158" width="296" height="196" rx="22" fill="url(#chassisGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" />

    <!-- Trapecio inferior característico del cabezal de lectura -->
    <path d="M 164,354 L 190,314 L 322,314 L 348,354 Z" fill="#181615" stroke="#3D3934" stroke-width="2" />

    <!-- Orificios inferiores guía del rodillo del cabezal -->
    <circle cx="220" cy="336" r="6.5" fill="#11100F" stroke="#48433E" stroke-width="1.5" />
    <circle cx="292" cy="336" r="6.5" fill="#11100F" stroke="#48433E" stroke-width="1.5" />

    <!-- Tornillos de ensamblaje en las 4 esquinas -->
    <circle cx="126" cy="176" r="2.8" fill="#4D4741" />
    <circle cx="386" cy="176" r="2.8" fill="#4D4741" />
    <circle cx="126" cy="336" r="2.8" fill="#4D4741" />
    <circle cx="386" cy="336" r="2.8" fill="#4D4741" />

    <!-- Etiqueta central de papel texturizado oscuro -->
    <rect x="146" y="186" width="220" height="110" rx="12" fill="#131211" stroke="#36322E" stroke-width="1.5" />

    <!-- Ventana acrílica de inspección de la cinta -->
    <rect x="176" y="206" width="160" height="68" rx="8" fill="#0D0C0B" stroke="#262320" stroke-width="1.5" />

    <!-- Carretes / Bobinas analógicas sólidas con alto contraste marfil/hueso (#EAE0D2) -->
    <!-- Carrete Izquierdo -->
    <g transform="translate(208, 240)">
      <!-- Bobina exterior -->
      <circle r="21" fill="#25221F" stroke="#EAE0D2" stroke-width="2.8" />
      <circle r="11" fill="#EAE0D2" />
      <circle r="5" fill="#0D0C0B" />
      <!-- Dientes dentados del eje central -->
      <path d="M-11,0 L-7,0 M11,0 L7,0 M0,-11 L0,-7 M0,11 L0,7" stroke="#0D0C0B" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Carrete Derecho -->
    <g transform="translate(304, 240)">
      <!-- Bobina exterior -->
      <circle r="21" fill="#25221F" stroke="#EAE0D2" stroke-width="2.8" />
      <circle r="11" fill="#EAE0D2" />
      <circle r="5" fill="#0D0C0B" />
      <!-- Dientes dentados del eje central -->
      <path d="M-11,0 L-7,0 M11,0 L7,0 M0,-11 L0,-7 M0,11 L0,7" stroke="#0D0C0B" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Cinta magnética inferior recta -->
    <line x1="184" y1="262" x2="328" y2="262" stroke="#25221F" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Cinta Magnética Superior: La onda acústica de la voz (El 'Echo') -->
    <!-- Conecta suavemente ambos carretes y modula en un pulso de audio en el centro -->
    <path d="M 220,256 
             C 232,256 238,256 243,256 
             C 245.5,256 247,236 249.5,236 
             C 251.5,236 253,266 255.5,266 
             C 257.5,266 259,244 261.5,244 
             C 263.5,244 265,256 268,256 
             L 292,256" 
          fill="none" 
          stroke="url(#voiceRibbon)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
