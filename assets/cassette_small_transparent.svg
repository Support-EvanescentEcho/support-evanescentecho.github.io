<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Versión transparente nativa para Taskbar de Windows (Claro y Oscuro) -->
  <!-- Silueta exterior con trazo de 2px -->
  <rect x="2" y="6" width="28" height="20" rx="3" fill="none" stroke="#E3D5C5" stroke-width="2" />

  <!-- Base trapezoidal del cabezal -->
  <path d="M 7,26 L 10,21 L 22,21 L 25,26" fill="none" stroke="#E3D5C5" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Ventana central -->
  <rect x="7" y="10" width="18" height="9" rx="1.5" fill="#E3D5C5" fill-opacity="0.15" stroke="#E3D5C5" stroke-width="1" />

  <!-- Carretes sólidos -->
  <circle cx="11.5" cy="14.5" r="2.5" fill="#E3D5C5" />
  <circle cx="11.5" cy="14.5" r="0.8" fill="#1C1B1A" />

  <circle cx="20.5" cy="14.5" r="2.5" fill="#E3D5C5" />
  <circle cx="20.5" cy="14.5" r="0.8" fill="#1C1B1A" />

  <!-- Onda de voz en ámbar -->
  <path d="M 14,15.5 L 15,13.5 L 17,15.5 L 18,15.5" fill="none" stroke="#D4A373" stroke-width="1" stroke-linecap="round" />
</svg>
